{# One-time Discord invite popup. Shown once per browser (localStorage), never over the tutorial popup. #}
<div id="ano-discord-popup" role="dialog" aria-modal="true" aria-labelledby="ano-discord-title" hidden>
  <div class="adp-backdrop" data-adp-close></div>
  <div class="adp-panel">
    <button type="button" class="adp-x" aria-label="Close" data-adp-close>&times;</button>
    <div class="adp-eyebrow">Community</div>
    <h2 id="ano-discord-title">Join the Discord</h2>
    <p>Ask questions, report bugs, find a coalition and get help from players and staff.</p>
    <a class="adp-join" href="https://discord.gg/SEae3Ua" target="_blank" rel="noopener noreferrer" data-adp-close>Join our Discord</a>
    <button type="button" class="adp-later" data-adp-close>Maybe later</button>
  </div>
</div>
<style>
#ano-discord-popup[hidden]{display:none}
#ano-discord-popup{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px}
#ano-discord-popup .adp-backdrop{position:absolute;inset:0;background:rgba(2,5,9,.78)}
#ano-discord-popup .adp-panel{position:relative;width:100%;max-width:340px;box-sizing:border-box;padding:24px 22px 14px;text-align:left;background:#070b12;color:#eef3f8;border:1px solid rgba(255,255,255,.12);border-top:2px solid #5fd4ff;border-radius:0;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:0 24px 60px -12px rgba(0,0,0,.8)}
#ano-discord-popup .adp-eyebrow{font:500 11px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;color:#5fd4ff;margin-bottom:6px}
#ano-discord-popup h2{margin:0 0 10px;font:600 26px/1.1 Oswald,Impact,"Arial Narrow",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#eef3f8}
#ano-discord-popup p{margin:0 0 18px;font:400 14px/1.5 Inter,system-ui,sans-serif;color:#8a97a8}
#ano-discord-popup .adp-join{display:block;padding:13px 16px;text-align:center;text-decoration:none;color:#fff;font:600 15px Oswald,Impact,"Arial Narrow",sans-serif;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(90deg,#1e9ac9,#2bb6ea);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
#ano-discord-popup .adp-join:hover{filter:brightness(1.1)}
#ano-discord-popup .adp-later{display:block;width:100%;margin-top:6px;padding:10px;background:none;border:0;color:#8a97a8;font:500 11px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
#ano-discord-popup .adp-later:hover{color:#eef3f8}
#ano-discord-popup .adp-x{position:absolute;top:8px;right:12px;background:none;border:0;color:#8a97a8;font-size:22px;line-height:1;cursor:pointer}
#ano-discord-popup .adp-x:hover{color:#eef3f8}
</style>
<script>
(function(){
  var K='ano_discord_popup_v1',el=document.getElementById('ano-discord-popup');
  if(!el)return;
  try{if(localStorage.getItem(K))return;}catch(e){}
  function close(){el.hidden=true;try{localStorage.setItem(K,'1');}catch(e){}}
  el.addEventListener('click',function(e){if(e.target.closest('[data-adp-close]'))close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!el.hidden)close();});
  setTimeout(function(){
    var tut=document.getElementById('onboarding-tutorial-popup');
    if(tut&&!tut.hidden)return;
    el.hidden=false;
  },6000);
})();
</script>
