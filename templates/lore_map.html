{% extends "layout.html" %}
{% block title %} Lore Map {% endblock %}
{% block body_class %} page-lore-map{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/map_parallax.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/civ_borders.css') }}">
<script src="{{ url_for('static', filename='js/civ_ui.js') }}"></script>
<style>
    html, body.page-lore-map {
        margin: 0;
        height: 100vh;
        overflow: hidden !important;
        background: #070b14 !important;
        font-family: Inter, system-ui, sans-serif;
    }

    .templatecontainer, .navbarparent:has(.templatecontainer), #page-content-wrapper,
    .container-fluid, .body-content {
        background: transparent !important;
        padding: 0 !important;
        border: 0 !important;
        box-shadow: none !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        min-height: 0 !important;
    }

    .footer, footer { display: none !important; }

    .templatedivtopper {
        position: fixed;
        top: 78px;
        left: 20px;
        z-index: 1000;
        max-width: calc(100vw - 40px);
        padding: 12px 22px;
        border: 1px solid rgba(164, 204, 235, 0.16);
        border-radius: 14px;
        background: rgba(8, 15, 27, 0.82);
        color: #fff;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.24);
        pointer-events: none;
        backdrop-filter: blur(12px);
    }

    .templatedivtitle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        color: #f2f8ff;
        font-size: 1.1rem;
        font-weight: 650;
        letter-spacing: 0.02em;
    }

    .templatedivtitle .material-icons-outlined { color: #69d7ff; }

    #viewport {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #070b14;
        touch-action: none;
        cursor: grab;
    }

    #map-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
    }

    #map-canvas:active { cursor: grabbing; }

    #map-status {
        position: fixed;
        z-index: 1100;
        top: 50%;
        left: 50%;
        width: min(90vw, 520px);
        transform: translate(-50%, -50%);
        padding: 18px 22px;
        border: 1px solid rgba(126, 205, 246, 0.25);
        border-radius: 14px;
        background: rgba(8, 16, 29, 0.94);
        color: #dcecff;
        font-size: 0.95rem;
        line-height: 1.5;
        text-align: center;
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.46);
    }

    #map-status[hidden] { display: none; }
    #map-status.map-status-error { border-color: rgba(255, 128, 128, 0.45); }

    .map-controls {
        position: fixed;
        right: 24px;
        bottom: max(24px, env(safe-area-inset-bottom));
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .control-btn {
        display: flex;
        width: 48px;
        height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid rgba(164, 204, 235, 0.2);
        border-radius: 50%;
        background: rgba(10, 19, 32, 0.9);
        color: #eef7ff;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
        transition: background-color 140ms ease, border-color 140ms ease;
    }

    .control-btn:hover, .control-btn:focus-visible {
        border-color: rgba(105, 215, 255, 0.85);
        background: #12304a;
    }

    @media (max-width: 600px) {
        .templatedivtopper { top: 68px; left: 12px; padding: 9px 14px; }
        .templatedivtitle { font-size: 0.98rem; }
        .map-controls { right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); }
        .control-btn { width: 44px; height: 44px; }
    }
</style>
{% endblock %}

{% block body %}
<div class="templatedivtopper">
    <h1 class="templatedivtitle">
        <span class="material-icons-outlined iconlarge">public</span>
        Province Worlds
    </h1>
</div>

<div id="viewport" aria-label="Interactive province map">
    <canvas id="map-canvas" role="img" aria-label="Province worlds. Drag to pan, scroll to zoom, and select a province to open it."></canvas>
</div>
<div id="map-status" role="status" aria-live="polite">Loading province worlds…</div>

<div class="map-controls">
    <button class="control-btn" onclick="zoom(0.2)" title="Zoom In"><span class="material-icons-outlined">add</span></button>
    <button class="control-btn" onclick="zoom(-0.2)" title="Zoom Out"><span class="material-icons-outlined">remove</span></button>
    <button class="control-btn" onclick="resetView()" title="Recenter"><span class="material-icons-outlined">my_location</span></button>
</div>

<script src="{{ url_for('static', filename='js/lore_map.js') }}" defer></script>
{% endblock %}
