<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}AnO Bot Dashboard{% endblock %}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f1a; color: #eee; min-height: 100vh;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid #2a2a3d; display: flex;
    align-items: center; justify-content: space-between;
  }
  header a { color: #eee; text-decoration: none; font-weight: 700; font-size: 1.1rem; }
  header .user { opacity: 0.7; font-size: 0.9rem; }
  main { max-width: 780px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  h2 { font-size: 1.15rem; margin: 28px 0 10px; border-bottom: 1px solid #2a2a3d; padding-bottom: 6px; }
  h3 { font-size: 1rem; margin: 16px 0 8px; opacity: 0.85; }
  p { line-height: 1.5; opacity: 0.85; }
  a { color: #7aa2ff; }
  .card { background: #17172a; border: 1px solid #2a2a3d; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; background: #5865F2; color: #fff;
    border: none; border-radius: 8px; padding: 10px 18px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; text-decoration: none;
  }
  .btn.danger { background: #a13a3a; }
  input, textarea {
    width: 100%; background: #0f0f1a; border: 1px solid #333; border-radius: 6px;
    color: #eee; padding: 9px 10px; font-size: 0.95rem; font-family: inherit;
  }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; margin-bottom: 14px; font-size: 0.9rem; }
  label.checkbox { flex-direction: row; align-items: center; gap: 8px; font-weight: 600; }
  label.checkbox input { width: auto; }
  form { display: flex; flex-direction: column; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #2a2a3d; }
  .guild-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .guild-row a {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px;
    border: 1px solid #2a2a3d; text-decoration: none; color: #eee;
  }
  .guild-row img { width: 36px; height: 36px; border-radius: 50%; }
  .guild-row .fallback {
    width: 36px; height: 36px; border-radius: 50%; background: #2a2a3d;
    display: flex; align-items: center; justify-content: center;
  }
  .inline-fields { display: flex; gap: 14px; flex-wrap: wrap; }
  .inline-fields label { flex: 1; min-width: 160px; }
</style>
</head>
<body>
<header>
  <a href="/dashboard">🛠️ AnO Bot Dashboard</a>
  {% if user %}<span class="user">{{ user.username }} &middot; <a href="/logout">log out</a></span>{% endif %}
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
