name: Community sync (Discord bugs, suggestions, weekly vote)

# Hourly bridge between Discord and the `community-queue` branch. See
# scripts/community/sync.py and community/README.md. The cloud Claude routine
# reads the queue, fixes bugs / builds voted features, and leaves replies in
# results/; this job posts them back to Discord and runs the Friday vote.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: community-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: community-queue
          path: community-queue
      - name: Sync Discord <-> queue
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 scripts/community/sync.py --queue community-queue
      - name: Commit queue changes
        if: always()
        working-directory: community-queue
        run: |
          git config user.name "ano-community-bot"
          git config user.email "community-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "sync $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin community-queue && git push -q origin HEAD:community-queue && exit 0
            sleep 5
          done
          exit 1
